name: infrctl CI

on:
  push:
    paths:
      - "infrctl/**"
      - ".github/workflows/infrctl-ci.yml"
  pull_request:
    paths:
      - "infrctl/**"
      - ".github/workflows/infrctl-ci.yml"

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package directory
        id: package-dir
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f infrctl/package.json ]; then
            echo "dir=infrctl" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json found at repo root or infrctl/" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ steps.package-dir.outputs.dir }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ steps.package-dir.outputs.dir }}

      - name: Build
        run: npm run build
        working-directory: ${{ steps.package-dir.outputs.dir }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ steps.package-dir.outputs.dir }}

      - name: Test
        run: npm test
        working-directory: ${{ steps.package-dir.outputs.dir }}

      - name: Pack dry run
        run: npm pack --dry-run
        working-directory: ${{ steps.package-dir.outputs.dir }}
