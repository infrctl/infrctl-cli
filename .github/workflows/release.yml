name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            verify: true
          - os: ubuntu-latest
            platform: linux-arm64
            verify: false
          - os: macos-13
            platform: darwin-x64
            verify: true
          - os: macos-14
            platform: darwin-arm64
            verify: true
          - os: windows-latest
            platform: win32-x64
            verify: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build binary
        run: npm run build:binary
        env:
          INFRCTL_BINARY_PLATFORM: ${{ matrix.platform }}

      - name: Verify binary
        if: matrix.verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            ./dist-bin/infrctl-${{ matrix.platform }}/infrctl.exe --version
          else
            ./dist-bin/infrctl-${{ matrix.platform }}/infrctl --version
          fi

      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail
          archive="infrctl-${{ matrix.platform }}.tar.gz"
          tar -czf "$archive" -C "dist-bin/infrctl-${{ matrix.platform }}" .
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: infrctl-${{ matrix.platform }}
          path: |
            infrctl-${{ matrix.platform }}.tar.gz
            infrctl-${{ matrix.platform }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Standalone infrctl binaries. npm users can install with \`npm install -g infrctl\`."
